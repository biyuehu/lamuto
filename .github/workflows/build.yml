name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build site
        run: |
          bun install
          bun run build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: page
          build_dir: dist
          fqdn: https://lamuto.hotaru.icu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
